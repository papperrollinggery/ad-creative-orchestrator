<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">提案第七页预览样例</title>
  <desc id="desc">左侧是主标题与三段较密正文，右侧是消费者使用产品的灰色示意画面，正文区域标出需要精简。</desc>
  <rect width="960" height="540" rx="24" fill="#f8fafc"/>
  <rect x="48" y="46" width="410" height="448" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="82" y="108" font-family="system-ui,sans-serif" font-size="32" font-weight="700" fill="#172033">让一刻成真</text>
  <text x="82" y="154" font-family="system-ui,sans-serif" font-size="18" fill="#475569">从真实消费者时刻进入产品证明</text>
  <g fill="#94a3b8">
    <rect x="82" y="204" width="320" height="12" rx="6"/>
    <rect x="82" y="232" width="292" height="12" rx="6"/>
    <rect x="82" y="260" width="330" height="12" rx="6"/>
    <rect x="82" y="288" width="306" height="12" rx="6"/>
    <rect x="82" y="316" width="324" height="12" rx="6"/>
    <rect x="82" y="344" width="286" height="12" rx="6"/>
  </g>
  <rect x="68" y="184" width="362" height="190" rx="14" fill="none" stroke="#ef4444" stroke-width="4"/>
  <rect x="492" y="46" width="420" height="448" rx="18" fill="#e2e8f0"/>
  <circle cx="702" cy="220" r="92" fill="#cbd5e1"/>
  <rect x="594" y="326" width="216" height="88" rx="44" fill="#94a3b8"/>
  <circle cx="888" cy="70" r="18" fill="#2563eb"/>
  <text x="82" y="412" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#dc2626">建议：正文压缩为 3 个要点</text>
</svg>
