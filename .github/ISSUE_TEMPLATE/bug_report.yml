name: Bug report
description: Report broken workflow behavior, validation failures, or unsafe output.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: current_state
    attributes:
      label: Current state
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected_state
    attributes:
      label: Expected state
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Command output, gate report, validation output, or file path.
      placeholder: |
        adco --version
        adco doctor
        adco doctor --json
        adco support-bundle <project_dir>
        adco support-bundle <project_dir> --json
        adco audit-dashboard <project_dir> --render --json
        adco validate <project_dir>
        adco validate <project_dir> --json
        adco check
        make release-check
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Smallest command sequence or project state that reproduces the issue.
      placeholder: |
        1. adco demo /tmp/adco-bug --no-open
        2. adco <command> ...
        3. observed output ...
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk area
      options:
        - client-visible artifact
        - visual/image asset
        - reference evidence
        - PPT/export
        - dashboard/handoff
        - goal/Gate workflow
        - install/package/CI
        - other
    validations:
      required: true
