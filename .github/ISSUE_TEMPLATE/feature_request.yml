name: Feature request
description: Suggest an improvement to the workflow, CLI, dashboard, or docs.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow pain does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should the project do?
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Acceptance evidence
      description: What command, gate, artifact, or dashboard state would prove it works?
      placeholder: |
        command:
        expected output:
        affected file or dashboard state:
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI/operator
        - dashboard/handoff
        - goal/Gate workflow
        - brand research lane
        - image workflow lane
        - install/package/CI
        - docs/onboarding
        - other
    validations:
      required: true
